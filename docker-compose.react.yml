version: '3.8'
services:
  react_dev_tarjetas:
    image: node:24-alpine
    container_name: react_dev_tarjetas
    ports:
      - "5174:5174"
    volumes:
      - .:/app/tarjetas-empleado
      - /app/tarjetas-empleado/node_modules
    working_dir: /app/tarjetas-empleado
    command: sh -c "npm ci --prefer-offline --no-audit --progress=false && npm run dev -- --host --port 5174"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5174/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    tty: true